edition = 3

[agent]
name = "openclaw-agent"
version = "0.1.0"
description = "openclaw agent for general usage"

readme = "OpenClaw agent bridge for Coral Protocol"
summary = "Bridges OpenClaw to Coral for multi-agent communication"

[agent.license]
type = "spdx"
expression = "MIT"

[options.auto_launch]
type = "string"
default = "false"

[runtimes.executable]
path = "bash"
arguments = ["startup.sh"]
transport = "streamable_http"
